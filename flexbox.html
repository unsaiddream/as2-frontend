<!DOCTYPE html>
<html lang="en">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a class="logo" href="index.html">Karaulov</a>

    <nav>
      <ul class="nav-links">

  <main class="flexbox-page">
    <h1>flexbox card row:</h1>

    <section class="card-container">

      <article class="card">
        <img src="https://imageio.forbes.com/specials-images/imageserve/62d700cd6094d2c180f269b9/0x0.jpg?format=jpg&crop=959,959,x0,y0,safe&height=416&width=416&fit=bounds" alt="elon musk">

        <p>CEO of Tesla & SpaceX</p>
        <a class="card-button" href="#">Read more</a>
      </article>

      <article class="card">
        <img src="https://imageio.forbes.com/specials-images/imageserve/67531eb2b5f7c9e191f632d7/0x0.jpg?format=jpg&crop=711,713,x316,y125,safe&height=416&width=416&fit=bounds" alt="jeff bezos" id="bezos">
        <h2>Jeff Bezos</h2>
        <p>CEO of Amazon</p>
        <a class="card-button" href="#">Read more</a>
      </article>

      <article class="card">
        <img src="https://imageio.forbes.com/specials-images/imageserve/62d599ede3ff49f348f9b9b4/0x0.jpg?format=jpg&crop=821,821,x155,y340,safe&height=416&width=416&fit=bounds" alt="bill gates" id="gates">
        <h2>Bill Gates</h2>
        <p>CEO of Microsoft</p>
        <a class="card-button" href="#">Read more</a>
      </article>

    </section>
